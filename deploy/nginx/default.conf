# Site estático da Unimaia. Roda atrás do proxy com HTTPS da VPS (que cuida do domínio e do certificado).
# Este container só fala HTTP na porta 8080, sem root.

# Log de acesso em JSON, uma linha por requisição, com request_id para rastrear.
# Registra só o caminho ($uri), sem query string, para não guardar dado pessoal por acidente.
log_format json_access escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","client_ip":"$http_x_forwarded_for",'
  '"proxy_ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration_s":$request_time,"referer":"$http_referer","user_agent":"$http_user_agent"}';

server_tokens off;

# Compressão de texto (HTML, CSS, JS, SVG). Imagens AVIF/WebP e fontes woff2 já vêm comprimidas.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml application/xml;

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/unimaia;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    access_log /dev/stdout json_access;
    error_log /dev/stderr warn;

    # Site só de leitura: não recebe formulários (o agendamento vai pelo WhatsApp).
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Health check para o Docker e para o proxy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # CSS, JS, fontes e imagens têm versão/hash no nome: cache de 1 ano no navegador.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Páginas: /medicina serve medicina.html. "no-cache" = o navegador sempre confere se há versão nova.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # Arquivos ocultos (.git, .env etc.) nunca são servidos.
    location ~ /\. {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
