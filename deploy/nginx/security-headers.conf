# Cabeçalhos de segurança de TODAS as respostas.
# Atenção (nginx): um add_header dentro de um location faz ele IGNORAR os add_header de fora.
# Por isso este arquivo é incluído em cada location que tem add_header (há um teste que confere).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; frame-src https://www.google.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Request-ID $request_id always;
