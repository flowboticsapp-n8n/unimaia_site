<!-- Logo oficial (versão horizontal). Arquivos gerados por scripts/brand_assets.py.
     AVIF/WebP são bem menores que PNG; o navegador escolhe o primeiro formato que suporta.
     width/height reservam o espaço da imagem e evitam que a página "pule" ao carregar. -->
<picture>
  <source type="image/avif" srcset="/assets/brand/logo-horizontal-v1-40.avif 1x, /assets/brand/logo-horizontal-v1-80.avif 2x">
  <source type="image/webp" srcset="/assets/brand/logo-horizontal-v1-40.webp 1x, /assets/brand/logo-horizontal-v1-80.webp 2x">
  <img src="/assets/brand/logo-horizontal-v1-40.png" srcset="/assets/brand/logo-horizontal-v1-80.png 2x" width="210" height="40" alt="Unimaia Clínica Médica e Odontológica" class="h-8 sm:h-10 w-auto" decoding="async">
</picture>
