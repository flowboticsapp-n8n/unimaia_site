  <!-- Modal de agendamento (abre pelos botões "Agendar"). Envia a solicitação pelo WhatsApp. -->
  <div id="booking-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="booking-modal-title">
    <div id="booking-modal-backdrop" class="fixed inset-0 bg-slate-900/70"></div>
    <div class="relative bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl z-10 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <div class="flex items-center gap-2">
          <span class="w-8 h-8 rounded-lg bg-brand-100 text-brand-700 flex items-center justify-center">
            <i data-lucide="calendar" class="w-4 h-4"></i>
          </span>
          <h2 id="booking-modal-title" class="text-base font-bold text-slate-900">Solicitar agendamento</h2>
        </div>
        <button type="button" class="close-booking-modal p-1.5 rounded-lg text-slate-400 hover:text-slate-700" aria-label="Fechar">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="modal-booking-form" class="space-y-4" novalidate>
        <fieldset>
          <legend class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Área de atendimento</legend>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <input type="radio" name="modal-service-category" id="mod-med" value="medical" class="sr-only peer" checked>
              <label for="mod-med" class="block text-center py-2 px-1 text-xs font-bold rounded-lg border border-slate-200 peer-checked:border-brand-600 peer-checked:bg-brand-50 peer-checked:text-brand-700 peer-focus-visible:ring-2 peer-focus-visible:ring-brand-600 cursor-pointer">Consulta</label>
            </div>
            <div>
              <input type="radio" name="modal-service-category" id="mod-dent" value="dental" class="sr-only peer">
              <label for="mod-dent" class="block text-center py-2 px-1 text-xs font-bold rounded-lg border border-slate-200 peer-checked:border-brand-600 peer-checked:bg-brand-50 peer-checked:text-brand-700 peer-focus-visible:ring-2 peer-focus-visible:ring-brand-600 cursor-pointer">Dentista</label>
            </div>
            <div>
              <input type="radio" name="modal-service-category" id="mod-exam" value="exams" class="sr-only peer">
              <label for="mod-exam" class="block text-center py-2 px-1 text-xs font-bold rounded-lg border border-slate-200 peer-checked:border-brand-600 peer-checked:bg-brand-50 peer-checked:text-brand-700 peer-focus-visible:ring-2 peer-focus-visible:ring-brand-600 cursor-pointer">Exames</label>
            </div>
          </div>
        </fieldset>

        <div>
          <label for="modal-booking-specialty" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Especialidade ou serviço</label>
          <select id="modal-booking-specialty" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-brand-600 focus:outline-none"></select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="modal-booking-name" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Seu nome</label>
            <input type="text" id="modal-booking-name" required maxlength="80" autocomplete="name" placeholder="Nome completo" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-brand-600 focus:outline-none">
          </div>
          <div>
            <label for="modal-booking-phone" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">WhatsApp</label>
            <input type="tel" id="modal-booking-phone" required maxlength="15" autocomplete="tel-national" inputmode="numeric" placeholder="(87) 99999-9999" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-brand-600 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="modal-booking-date" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Data desejada</label>
            <input type="date" id="modal-booking-date" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-brand-600 focus:outline-none">
          </div>
          <div>
            <label for="modal-booking-shift" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Turno</label>
            <select id="modal-booking-shift" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-brand-600 focus:outline-none">
              <option value="Qualquer horário">Qualquer horário</option>
              <option value="Manhã">Manhã</option>
              <option value="Tarde">Tarde</option>
            </select>
          </div>
        </div>


        <p id="modal-booking-error" class="hidden text-xs font-semibold text-red-700" role="alert"></p>

        <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 rounded-xl text-sm shadow-md transition flex items-center justify-center gap-2 disabled:opacity-60">
          <i data-lucide="message-circle" class="w-4 h-4"></i>
          Enviar pelo WhatsApp
        </button>
        <p class="text-[11px] text-slate-500 text-center">Seus dados não ficam salvos no site. Eles vão só na mensagem que você envia pelo WhatsApp.</p>
      </form>
    </div>
  </div>

  <!-- Botão flutuante do WhatsApp: um toque e abre a conversa -->
  <a href="{{site.whatsappLink}}?text=Ol%C3%A1!%20Gostaria%20de%20informa%C3%A7%C3%B5es%20sobre%20agendamento." target="_blank" rel="noopener" aria-label="Conversar pelo WhatsApp" class="fixed bottom-5 right-5 z-40 w-14 h-14 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white shadow-xl flex items-center justify-center transition hover:scale-105 active:scale-95">
    <i data-lucide="message-circle" class="w-7 h-7"></i>
  </a>
