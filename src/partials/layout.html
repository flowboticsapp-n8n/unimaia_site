<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <meta name="robots" content="{{page.robots}}">
  <meta name="theme-color" content="#0a2748">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Prévia ao compartilhar o link (WhatsApp, Instagram, Facebook). A imagem PRECISA de URL absoluta
       (https://...): com caminho relativo o WhatsApp não mostra a prévia. Arte gerada por scripts/og_image.py. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="{{site.legalName}}">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{page.url}}">
  <meta property="og:image" content="{{site.siteUrl}}/assets/img/og-unimaia-v1.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{site.legalName}}: especialistas em um só lugar, em {{site.city}}-{{site.state}}">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fontes hospedadas no próprio site: o navegador começa a baixar antes de ler o CSS -->
  <link rel="preload" href="/assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{asset.css}}">
  <script src="{{asset.js}}" defer></script>
  {{page.head}}
</head>
<body class="min-h-screen flex flex-col pb-[calc(4rem_+_env(safe-area-inset-bottom))] lg:pb-0 bg-slate-50 text-slate-800 antialiased selection:bg-brand-500 selection:text-white" data-whatsapp="{{site.whatsapp}}">
  <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[60] focus:bg-white focus:text-brand-900 focus:px-4 focus:py-2 focus:rounded-lg focus:shadow-lg">Pular para o conteúdo</a>

  <!-- include:header -->

  <main id="conteudo" class="flex-1 flex flex-col">
<!-- page:content -->
  </main>

  <!-- include:footer -->
  <!-- include:widgets -->
  <!-- include:mobile-nav -->
</body>
</html>
